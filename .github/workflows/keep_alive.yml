name: Keep Vercel App Warm

on:
  schedule:
    # Run every 5 minutes to prevent Vercel serverless cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging https://wes-vendor.vercel.app/health to keep it warm..."
          curl -sSf https://wes-vendor.vercel.app/health
          echo -e "\nSuccessfully pinged."
